<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMG Report v1.2</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a84ff">
<script>
if('serviceWorker' in navigator) { 
  navigator.serviceWorker.register('sw.js')
    .then(registration => { console.log('✅ SW registered'); })
    .catch(err => { console.log('⚠️ SW skipped — works fine'); });
}
</script>
<style>
 body { font-family: Arial; background: #1c1c1e; color: #fff; padding: 15px; margin: 0; max-width: 100%; }
 #output { background: #111; color: #fff; padding: 15px; border-radius: 8px; margin-top: 15px; white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.5; display: none; word-break: break-word; border: 1px solid #0a84ff; }
 h2 { text-align: center; color: #0a84ff; margin-bottom: 20px; }
 input, select, textarea { padding: 10px; margin: 0; border-radius: 8px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; box-sizing: border-box; font-size: 14px; }
 label { 
   font-weight: normal; 
   color: #98989f; 
   font-size: 12px;
   display: block;
   margin-bottom: 4px;
   margin-top: 12px;
 }
 .row { display: flex; gap: 10px; flex-wrap: nowrap; margin-bottom: 8px; }
 .col { flex: 1; width: 50%; }
 button { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
 .generate { background: #0a84ff; color: white; }
 .copy { background: #30d158; color: white; display: none; }
 .clear { background: #ff453a; color: white; }
 .section-title { text-align: center; margin: 15px 0 5px 0; color: #0a84ff; font-weight: bold; }
 #advancedSection, #accidentSection, #stalledSection { display: none; }
 .toggle-btn { 
   background: #2c2c2e; color: #0a84ff; 
   border: 2px dashed #0a84ff; margin: 10px 0 20px 0; 
 }
 .vehicle-box { background: #2c2c2e; border: 2px solid #3a3a3c; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
 .add-btn { width: 100%; background: #2c2c2e; color: #0a84ff; border: 2px dashed #0a84ff; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-bottom: 15px; }
</style>
</head>
<body>
<h2>TMG REPORT v1.2</h2>

<div class="row">
  <div class="col">
    <label>DATE</label>
    <input type="text" id="date" readonly style="width:100%;">
  </div>
  <div class="col">
    <label>TIME</label>
    <input type="time" id="time" style="width:100%;">
  </div>
</div>

<div class="row">
  <div class="col">
    <label>MOBILE</label>
    <select id="mobile" style="width:100%;">
     <option value="" selected>SELECT MOBILE</option>
     <option value="M01">M01</option> <option value="M02">M02</option> <option value="M03">M03</option>
     <option value="M05">M05</option> <option value="M06">M06</option> <option value="M07">M07</option>
    </select>
  </div>
  <div class="col">
    <label>TMG+SHIFT</label>
    <select id="shift" style="width:100%;">
     <option value="" selected>SELECT SHIFT</option>
     <option value="1ST">1ST SHIFT</option>
     <option value="2ND">2ND SHIFT</option>
     <option value="3RD">3RD SHIFT</option>
    </select>
  </div>
</div>

<label>AOR</label>
<div class="row">
  <select id="aor-select" style="width:10%;" onchange="document.getElementById('aor').value=this.value; this.selectedIndex=0;">
  <option value="">PUMILI NG AOR</option>
   <option>ELLIPTICAL - COMMONWEALTH</option>
   <option>COMMONWEALTH</option>
   <option>ELLIPTICAL</option>
   <option>EDSA MEGAMALL</option>
   <option>EDSA BALINTAWAK</option>
  </select>
  <input type="text" id="aor" style="width:90%;" placeholder="O I-TYPE DITO">
</div>

<label>LOCATION</label>
<div class="row">
  <select id="loc-select" style="width:10%;" onchange="document.getElementById('loc').value=this.value; this.selectedIndex=0;">
  <option value="">PUMILI NG LOCATION</option>
   <option>ELLIPTICAL</option>
   <option>COMMONWEALTH</option>
   <option>SOLIVEN COMMO. E/B</option>
   <option>DONA CARMEN COMMO. E/B</option>
   <option>WISTON COMMO. E/B</option>
   <option>MARLBORO COMMO. E/B</option>
   <option>REGALADO COMMO. E/B</option>
   <option>TECHNOHUB COMMO. W/B</option>
   <option>EDSA MEGAMALL NB</option>
   <option>EDSA BALINTAWAK SB</option>
  </select>
  <input type="text" id="loc" style="width:90%;" placeholder="O I-TYPE DITO">
</div>

<label>TRAFFIC SITUATION</label>
<select id="traffic" style="width:100%;">
 <option value="" selected>SELECT SITUATION</option>
 <option value="LIGHT">LIGHT</option>
 <option value="MODERATE">MODERATE</option>
 <option value="HEAVY">HEAVY</option>
</select>

<label>CURRENT SITUATION</label>
<textarea id="situation" rows="2" style="width:100%;" placeholder="CONDUCT AREA MONITORING"></textarea>

<label>WEATHER CONDITION</label>
<select id="weather" style="width:100%;">
 <option value="" selected>SELECT WEATHER</option>
 <option value="FAIR">FAIR</option>
 <option value="CLOUDY">CLOUDY / DAZZLE</option>
 <option value="RAINY">RAINY</option>
 <option value="LIGHT RAIN">LIGHT RAIN</option>
 <option value="MODERATE RAIN">MODERATE RAIN</option>
 <option value="HEAVY RAIN">HEAVY RAIN</option>
 <option value="FOGGY">FOGGY</option>
 <option value="WINDY">WINDY</option>
 <option value="STORM">STORM</option>
</select>

<button type="button" class="toggle-btn" id="advToggle" onclick="toggleAdvanced()">➕ MORE OPTIONS (Stalled / Accident / Remarks / Time Cleared)</button>

<div id="advancedSection">
<div class="section-title">--- STALLED VEHICLE ---</div>
<select id="stalledSelect" onchange="toggleStalled(this.value)">
 <option value="no" selected>NO STALLED</option>
 <option value="yes">YES STALLED</option>
</select>
<div id="stalledSection">
 <div class="vehicle-box">
 <label>PLATE NO / MAKE / MODEL</label>
 <input type="text" id="stalledVehicle" style="width:100%;" placeholder="">
 <label>REASON: OVERHEAT / FLAT TIRE / ENGINE TROUBLE</label>
 <input type="text" id="stalledReason" style="width:100%;" placeholder="OVERHEAT / FLAT TIRE / ENGINE TROUBLE">
 <label>DRIVER NAME:</label>
 <input type="text" id="stalledDriver" style="width:100%;" placeholder="">
 <label>DRIVER LIC.NO.:</label>
 <input type="text" id="stalledlicno" style="width:100%;" placeholder="">
 <label>TOWTRUCK:</label>
 <input type="text" id="towtruck" style="width:100%;" placeholder="">
 <label>ADDRESS:</label>
 <input type="text" id="stalledproda" style="width:100%;" placeholder="">
 <label>TICKET NO.:</label>
 <input type="text" id="ticketno" style="width:100%;" placeholder="">
 </div>
</div>

<div class="section-title">--- VEHICULAR ACCIDENT ---</div>
<select id="accidentSelect" onchange="toggleAccident(this.value)">
 <option value="no" selected>NO ACCIDENT</option>
 <option value="yes">YES ACCIDENT</option>
</select>
<div id="accidentSection">
 <div class="section-title">VEHICLES INVOLVED</div>
 <div id="vehiclesContainer">
 <div class="vehicle-box vehicle-entry" data-vehicle="1">
 <h4 style="color:#0a84ff;margin:0 0 12px 0">VEHICLE 1</h4>
 <label>PLATE NO / MAKE / MODEL</label>
 <input type="text" id="vehicle1_type" style="width:100%;" placeholder="">
 <label>OR NO.</label>
 <input type="text" id="vehicle1_or" style="width:100%;" placeholder="">
 <label>CR NO.</label>
 <input type="text" id="vehicle1_cr" style="width:100%;" placeholder="">
 <label>DRIVER NAME</label>
 <input type="text" id="vehicle1_driver" style="width:100%;" placeholder="">
 <label>LICENSE NO.</label>
 <input type="text" id="vehicle1_lic" style="width:100%;" placeholder="">
 <label>ADDRESS</label>
 <input type="text" id="vehicle1_addr" style="width:100%;" placeholder="">
 <label>TYPE OF COLLISION</label>
 <div class="row">
  <select id="vehicle1_collision_sel" style="width:10%;" onchange="document.getElementById('vehicle1_collision').value=this.value; this.selectedIndex=0;">
   <option value="">-- PUMILI --</option>
   <option>SIDESWIPE</option>
   <option>REAR END</option>
   <option>HEAD ON</option>
   <option>ANGLE IMPACT</option>
   <option>HIT AND RUN</option>
   <option>SELF ACCIDENT</option>
  </select>
  <input type="text" id="vehicle1_collision" style="width:90%;" placeholder="O I-TYPE DITO">
 </div>
 </div>
 </div>
 <button type="button" onclick="addVehicle()" class="add-btn">➕ Add Another Vehicle</button>
</div>

<label>REMARKS</label>
<textarea id="remarks" rows="2" style="width:100%;" placeholder=""></textarea>

<div class="row">
  <div class="col">
    <label>TIME CLEARED</label>
    <input type="time" id="cleared" style="width:100%;">
  </div>
  <div class="col"></div>
</div>

</div>

<label>REPORTED BY - MAX 4 PERSONS</label>
<select id="reportedby" multiple size="4" style="width:100%; height: auto;">
 <option value="CHAVEZ (TMG)">CHAVEZ</option>
 <option value="CONTAWE (TMG)">CONTAWE</option>
 <option value="BAYAUA (TMG)">BAYAUA</option>
 <option value="LAZARO (TMG)">LAZARO</option>
 <option value="ROMEN (TMG)">ROMEN</option>
 <option value="ROSALES (TMG)">ROSALES</option>
 <option value="DUMPIT (TMG)">DUMPIT</option>
 <option value="BACAY (CSTD)">BACAY</option>
 <option value="SORIANO (CSTD)">SORIANO</option>
 <option value="TALISIC (CSTD)">TALISIC</option>
 <option value="DUMALAON (CSTD)">DUMALAON</option>
</select>

<button class="generate" onclick="generateReport()">Generate Report</button>
<button class="copy" id="copyBtn" onclick="copyReport()">📋 Copy Report</button>
<button class="clear" onclick="clearForm()">Clear Form</button>
<pre id="output"></pre>

<script>
let advVisible = false;
function toggleAdvanced() {
  advVisible = !advVisible;
  const sec = document.getElementById('advancedSection');
  const btn = document.getElementById('advToggle');
  sec.style.display = advVisible ? 'block' : 'none';
  btn.innerText = advVisible ? '➖ HIDE OPTIONS' : '➕ MORE OPTIONS (Stalled / Accident / Remarks / Time Cleared)';
}

document.addEventListener('input', function(e) {
  if(e.target.tagName === 'INPUT' && e.target.type === 'text') e.target.value = e.target.value.toUpperCase();
  if(e.target.tagName === 'TEXTAREA') e.target.value = e.target.value.toUpperCase();
});

document.getElementById('reportedby').addEventListener('change', function() {
  let selected = Array.from(this.selectedOptions);
  if(selected.length > 4) {
    selected[selected.length - 1].selected = false;
    alert('HANGGANG 4 LANG PWEDE PILIIN!');
  }
});

let vehicleCount = 1;
const now = new Date();
const options = { month: 'short', day: '2-digit', year: 'numeric' };
document.getElementById('date').value = now.toLocaleDateString('en-US', options).toUpperCase();
document.getElementById('time').value = now.toTimeString().slice(0,5);

function toggleStalled(val) {
  document.getElementById('stalledSection').style.display = (val === 'yes') ? 'block' : 'none';
  if(val === 'no') {
    document.getElementById('stalledVehicle').value = '';
    document.getElementById('stalledReason').value = '';
    document.getElementById('stalledDriver').value = '';
    document.getElementById('stalledlicno').value = '';
    document.getElementById('stalledproda').value = '';
    document.getElementById('towtruck').value = '';
    document.getElementById('ticketno').value = '';
  }
}

function toggleAccident(val) {
  document.getElementById('accidentSection').style.display = (val === 'yes') ? 'block' : 'none';
  if(val === 'no') clearAccidentData();
}

function addVehicle() {
  vehicleCount++;
  const container = document.getElementById('vehiclesContainer');
  const newVehicle = document.createElement('div');
  newVehicle.className = 'vehicle-box vehicle-entry';
  newVehicle.setAttribute('data-vehicle', vehicleCount);
  newVehicle.innerHTML = `
 <h4 style="color:#0a84ff;margin:0 0 12px 0">VEHICLE ${vehicleCount}</h4>
 <label>PLATE NO / MAKE / MODEL</label>
 <input type="text" id="vehicle${vehicleCount}_type" style="width:100%;" placeholder="">
 <label>OR NO.</label>
 <input type="text" id="vehicle${vehicleCount}_or" style="width:100%;" placeholder="">
 <label>CR NO.</label>
 <input type="text" id="vehicle${vehicleCount}_cr" style="width:100%;" placeholder="">
 <label>DRIVER NAME</label>
 <input type="text" id="vehicle${vehicleCount}_driver" style="width:100%;" placeholder="">
 <label>LICENSE NO.</label>
 <input type="text" id="vehicle${vehicleCount}_lic" style="width:100%;" placeholder="">
 <label>ADDRESS</label>
 <input type="text" id="vehicle${vehicleCount}_addr" style="width:100%;" placeholder="">
 <label>TYPE OF COLLISION</label>
 <div class="row">
  <select id="vehicle${vehicleCount}_collision_sel" style="width:10%;" onchange="document.getElementById('vehicle${vehicleCount}_collision').value=this.value; this.selectedIndex=0;">
   <option value="">-- PUMILI --</option>
   <option>SIDESWIPE</option>
   <option>REAR END</option>
   <option>HEAD ON</option>
   <option>ANGLE IMPACT</option>
   <option>HIT AND RUN</option>
   <option>SELF ACCIDENT</option>
  </select>
  <input type="text" id="vehicle${vehicleCount}_collision" style="width:90%;" placeholder="O I-TYPE DITO">
 </div>
 `;
  container.appendChild(newVehicle);
}

function clearAccidentData() {
  document.getElementById('vehiclesContainer').innerHTML = `
 <div class="vehicle-box vehicle-entry" data-vehicle="1">
 <h4 style="color:#0a84ff;margin:0 0 12px 0">VEHICLE 1</h4>
 <label>PLATE NO / MAKE / MODEL</label>
 <input type="text" id="vehicle1_type" style="width:100%;" placeholder="">
 <label>OR NO.</label>
 <input type="text" id="vehicle1_or" style="width:100%;" placeholder="">
 <label>CR NO.</label>
 <input type="text" id="vehicle1_cr" style="width:100%;" placeholder="">
 <label>DRIVER NAME</label>
 <input type="text" id="vehicle1_driver" style="width:100%;" placeholder="">
 <label>LICENSE NO.</label>
 <input type="text" id="vehicle1_lic" style="width:100%;" placeholder="">
 <label>ADDRESS</label>
 <input type="text" id="vehicle1_addr" style="width:100%;" placeholder="">
 <label>TYPE OF COLLISION</label>
 <div class="row">
  <select id="vehicle1_collision_sel" style="width:10%;" onchange="document.getElementById('vehicle1_collision').value=this.value; this.selectedIndex=0;">
   <option value="">-- PUMILI --</option>
   <option>SIDESWIPE</option>
   <option>REAR END</option>
   <option>HEAD ON</option>
   <option>ANGLE IMPACT</option>
   <option>HIT AND RUN</option>
   <option>SELF ACCIDENT</option>
  </select>
  <input type="text" id="vehicle1_collision" style="width:90%;" placeholder="O I-TYPE DITO">
 </div>
 </div>
 `;
  vehicleCount = 1;
}

function generateReport() {
  const get = id => document.getElementById(id).value.trim();
  const shift = get('shift');
  if(!shift) { alert('PILI MUNA ANG SHIFT!'); return; }
 
  let unit = "TMG";
  let mobile = get('mobile');
  let date = get('date');
  let time = get('time');
  if(time) { time = time.replace(':', '') + 'H'; }
 
  let report = '';
  report += `🚦🚦 TRAFFIC UPDATE 🚦🚦\n\n`;
  report += `UNIT: ${unit} ${shift} SHIFT\n`;
  report += `MOBILE: ${mobile}\n`;
  report += `DATE: ${date}\n`;
  report += `TIME: ${time}\n`;
  report += `AOR : ${get('aor').toUpperCase()}\n`;
  report += '____________________\n\n';
  if(get('loc')) report += 'LOCATION:\n  * ' + get('loc') + '\n';
  if(get('traffic')) report += 'TRAFFIC SITUATION:\n  * ' + get('traffic') + '\n';
  if(get('weather')) report += 'WEATHER CONDITION:\n  * ' + get('weather') + '\n';
 
  let situation = get('situation');
  if(!situation) situation = 'CONDUCT AREA MONITORING';
  let s = situation.split('\n').map(line => '  * ' + line).join('\n');
  report += 'CURRENT SITUATION:\n' + s + '\n';
 
  if(document.getElementById('accidentSelect').value === 'yes') {
    report += '\n🚖 VEHICLES INVOLVED 🚖\n';
    const vehicles = document.querySelectorAll('.vehicle-box.vehicle-entry');
    vehicles.forEach((box, index) => {
      const num = index + 1;
      const vtype = get(`vehicle${num}_type`);
      const vor = get(`vehicle${num}_or`);
      const vcr = get(`vehicle${num}_cr`);
      const vdriver = get(`vehicle${num}_driver`);
      const vlic = get(`vehicle${num}_lic`);
      const vaddr = get(`vehicle${num}_addr`);
      const vcollision = get(`vehicle${num}_collision`);
      if(vtype || vdriver) {
        report += `\nVEHICLE ${num}:\n`;
        if(vtype) report += `  * ${vtype}\n`;
        if(vor) report += `OR:\n  * ${vor}\n`;
        if(vcr) report += `CR:\n  * ${vcr}\n`;
        if(vdriver) report += `DRIVER:\n  * ${vdriver}\n`;
        if(vlic) report += `LIC NO:\n  * ${vlic}\n`;
        if(vaddr) report += `ADDRESS:\n  * ${vaddr}\n`;
        if(vcollision) report += `COLLISION TYPE:\n  * ${vcollision}\n`;
      }
    });
  }
 
  if(document.getElementById('stalledSelect').value === 'yes') {
    const stalled = get('stalledVehicle');
    const stalledR = get('stalledReason');
    const stalledD = get('stalledDriver');
    const stalledLic = get('stalledlicno');
    const stalledAddr = get('stalledproda');
    const tow = get('towtruck');
    const ticket = get('ticketno');
    if(stalled || stalledD) {
      report += '\n🛢️ STALLED VEHICLE\n\n';
      if(stalled) report += 'PLATE/MAKE:\n  * ' + stalled + '\n';
      if(stalledR) report += 'REASON:\n  * ' + stalledR + '\n';
      if(stalledD) report += 'DRIVER:\n  * ' + stalledD + '\n';
      if(stalledLic) report += 'LICENSE NO:\n  * ' + stalledLic + '\n';
      if(stalledAddr) report += 'ADDRESS:\n  * ' + stalledAddr + '\n';
      if(tow) report += 'TOWTRUCK:\n  * ' + tow + '\n';
      if(ticket) report += 'TICKET NO:\n  * ' + ticket + '\n';
    }
  }
 
  if(get('remarks')) {
    let r = get('remarks').split('\n').map(line => '  * ' + line).join('\n');
    report += '\nREMARKS:\n' + r + '\n';
  }
  if(get('cleared')) report += '\nTIME CLEARED:\n  * ' + get('cleared') + '\n';
  report += '____________________\n';
 
  let reporters = Array.from(document.getElementById('reportedby').selectedOptions).map(opt => opt.value);
  if(reporters.length > 0) {
    report += 'REPORTED BY:\n';
    reporters.forEach(name => { report += '  * ' + name + '\n'; });
  }
 
  document.getElementById('output').style.display = 'block';
  document.getElementById('output').innerText = report;
  document.getElementById('copyBtn').style.display = 'block';
}

function copyReport() {
  const text = document.getElementById('output').innerText;
  if (!text) { alert('WALA PANG REPORT NA GENERATED!'); return; }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  document.getElementById('copyBtn').innerText = '✅ Copied!';
  setTimeout(() => document.getElementById('copyBtn').innerText = '📋 Copy Report', 2000);
}

function clearForm() {
  document.querySelectorAll('input').forEach(el => { if(el.id !== 'date') el.value = ''; });
  document.querySelectorAll('select').forEach(el => el.selectedIndex = 0);
  document.querySelectorAll('textarea').forEach(el => el.value = '');
 
  document.getElementById('stalledSelect').value = 'no'; toggleStalled('no');
  document.getElementById('accidentSelect').value = 'no'; toggleAccident('no');
 
  document.getElementById('output').style.display = 'none';
  document.getElementById('copyBtn').style.display = 'none';
  document.getElementById('time').value = new Date().toTimeString().slice(0,5);
 
  advVisible = false;
  document.getElementById('advancedSection').style.display = 'none';
  document.getElementById('advToggle').innerText = '➕ MORE OPTIONS (Stalled / Accident / Remarks / Time Cleared)';
}
</script>
  <script>
// Register Service Worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(registration) {
        console.log('Service Worker registered:', registration);
      })
      .catch(function(error) {
        console.log('Service Worker registration failed:', error);
      });
  });
}
</script>
</body>
</html>
